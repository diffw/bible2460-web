<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Back to Bible 2460</title>
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/logo.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
  <style>
    .callback {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 2rem;
    }
    .callback h1 {
      font-family: var(--serif);
      font-size: 2rem;
      font-weight: 600;
      margin-bottom: 0.5rem;
    }
    .callback p {
      color: var(--text-2);
      font-size: 1.1rem;
      line-height: 1.6;
      max-width: 420px;
      margin-bottom: 2rem;
    }
  </style>
</head>
<body>
  <!-- TikTok returns here after a share from the app; with the app installed iOS opens the app instead. -->
  <main class="callback">
    <img src="/logo.svg" alt="" width="72" height="72" class="app-icon">
    <h1>Back to Bible 2460</h1>
    <p>Your verse is on its way to TikTok. Open Bible 2460 to keep going.</p>
    <a href="https://apps.apple.com/us/app/bible-2460-bible-widget/id6760091043" class="btn btn-primary">Open in the App Store</a>
  </main>
</body>
</html>
